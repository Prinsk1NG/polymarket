name: Polymarket Capital Watcher

on:
  # 定时执行：每天 UTC 时间 04:00（对应北京时间中午 12:00）
  schedule:
    - cron: '0 4 * * *'
  
  # 允许在 GitHub Actions 页面手动随时触发
  workflow_dispatch:

# 🚨 极其重要：赋予写入权限
permissions:
  contents: write

jobs:
  market-monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 🚨 修复点：在这里增加 xai-sdk 的安装
          pip install requests xai-sdk
          
      - name: Run Polymarket Watch Script
        env:
          # 必填：用于推送卡片
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          
          # 必填：用于 Grok 深度分析
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          
          # 可选：用于生成云文档
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python polymarket_watch.py

      - name: Commit and Push Polymarket History
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add market_history.json || true
          git commit -m "🤖 Auto-save Polymarket history" || echo "No changes to commit"
          git push

name: Polymarket Capital Watcher

on:
  # 定时执行：每天 UTC 时间 04:00（对应北京时间中午 12:00）
  schedule:
    - cron: '0 4 * * *'
  
  # 允许在 GitHub Actions 页面手动随时触发
  workflow_dispatch:

# 🚨 极其重要：赋予 Action 机器人写入权限，否则无法保存市场历史涨跌数据
permissions:
  contents: write

jobs:
  market-monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 这个脚本极其轻量，只需要 requests 库即可
          pip install requests
          
      - name: Run Polymarket Watch Script
        env:
          # 🚨 从你的 Secrets 中读取飞书机器人的链接
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          
          # (可选) 如果你配置了飞书云文档长文推送
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          # 确保你仓库里的脚本名字叫 polymarket_watch.py
          python polymarket_watch.py

      # 🚨 核心底盘：把跑完生成的历史数据保存回 GitHub 仓库
      - name: Commit and Push Polymarket History
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 把脚本生成的 JSON 历史账本存起来，用于计算明天的涨跌幅
          git add market_history.json || true
          git commit -m "🤖 Auto-save Polymarket history" || echo "No changes to commit"
          git push
